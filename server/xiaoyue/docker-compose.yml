services:
  postgres:
    image: postgres:17.11
    container_name: xiaoyue-postgres
    restart: unless-stopped
    env_file:
      - ./config/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaoyue -d xiaoyue"]
      interval: 10s
      timeout: 5s
      retries: 5

  callback:
    build:
      context: ./app/callback
    container_name: xiaoyue-callback
    restart: unless-stopped
    env_file:
      - ./config/wecom_callback.env
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    container_name: xiaoyue-caddy
    restart: unless-stopped
    depends_on:
      callback:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
