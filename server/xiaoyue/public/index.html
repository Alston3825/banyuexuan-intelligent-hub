<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>西安伴月安健康管理有限公司</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; color: #1f2937; background: #f8fafc; }
    main { display: grid; place-items: center; padding: 32px 20px; text-align: center; }
    .card { width: min(560px,100%); padding: 48px 28px; border: 1px solid #e5e7eb; border-radius: 16px; background: #fff; box-shadow: 0 12px 35px rgba(15,23,42,.06); }
    h1 { margin: 0 0 14px; font-size: clamp(24px,5vw,34px); font-weight: 650; letter-spacing: .03em; }
    p { margin: 0; color: #64748b; font-size: 15px; }
    footer { padding: 18px 16px 24px; text-align: center; color: #64748b; font-size: 13px; }
    footer a { color: #475569; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .divider { display: inline-block; margin: 0 8px; color: #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="site-title">
      <h1 id="site-title">西安伴月安健康管理有限公司</h1>
      <p>官方网站 · 信息公示</p>
    </section>
  </main>
  <footer>
    <span>© 2026 西安伴月安健康管理有限公司</span>
    <span class="divider">|</span>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">陕ICP备2026023071号-1</a>
    <!-- 公安联网备案通过后，在这里加入本地公安备案图标、正式编号和查询链接。 -->
  </footer>
</body>
</html>
